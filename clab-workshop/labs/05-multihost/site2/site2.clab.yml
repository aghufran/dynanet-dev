# Part 5 (multi-host labs): the half of the routed lab that runs on lab-host-2.
#
#   lab-host-1 (192.168.100.11)                lab-host-2 (192.168.100.12)
#   h1 ---- xrd1 ==== VXLAN VNI 100 ==== xrd2 ---- h2
name: site2

topology:
  kinds:
    cisco_xrd:
      image: ios-xr/xrd-control-plane:7.11.2
    linux:
      image: alpine:3

  nodes:
    xrd2:
      kind: cisco_xrd
      mgmt-ipv4: 172.20.20.12
      startup-config: configs/xrd2.cfg
    h2:
      kind: linux
      mgmt-ipv4: 172.20.20.22
      exec:
        - ip link set eth1 mtu 1450     # match the VXLAN tunnel
        - ip addr add 192.168.2.10/24 dev eth1
        - ip route add 192.168.1.0/24 via 192.168.2.1

  links:
    - endpoints: ["xrd2:Gi0-0-0-0", "h2:eth1"]
    # The cross-host link: a VXLAN tunnel to lab-host-1. Same VNI and port on both sides.
    - type: vxlan
      endpoint:
        node: xrd2
        interface: Gi0-0-0-1
      remote: 192.168.100.11
      vni: 100
      dst-port: 4789

# Part 5 (multi-host labs): the half of the routed lab that runs on lab-host-1.
#
#   lab-host-1 (192.168.100.11)                lab-host-2 (192.168.100.12)
#   h1 ---- xrd1 ==== VXLAN VNI 100 ==== xrd2 ---- h2
name: site1

topology:
  kinds:
    cisco_xrd:
      image: ios-xr/xrd-control-plane:7.11.2
    linux:
      image: alpine:3

  nodes:
    xrd1:
      kind: cisco_xrd
      mgmt-ipv4: 172.20.20.11
      startup-config: configs/xrd1.cfg
    h1:
      kind: linux
      mgmt-ipv4: 172.20.20.21
      exec:
        - ip link set eth1 mtu 1450     # match the VXLAN tunnel
        - ip addr add 192.168.1.10/24 dev eth1
        - ip route add 192.168.2.0/24 via 192.168.1.1

  links:
    - endpoints: ["h1:eth1", "xrd1:Gi0-0-0-0"]
    # The cross-host link: a VXLAN tunnel to lab-host-2.
    - type: vxlan
      endpoint:
        node: xrd1
        interface: Gi0-0-0-1
      remote: 192.168.100.12
      vni: 100
      dst-port: 4789

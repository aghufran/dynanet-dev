hostname xrd2
username clab
 group root-lr
 group cisco-support
 secret clab@123
!
line default
 transport input ssh
!
interface GigabitEthernet0/0/0/0
 description to h2
 ipv4 address 192.168.2.1 255.255.255.0
!
interface GigabitEthernet0/0/0/1
 description to xrd1
 ipv4 address 10.0.12.2 255.255.255.252
!
router static
 address-family ipv4 unicast
  192.168.1.0/24 10.0.12.1
  0.0.0.0/0 MgmtEth0/RP0/CPU0/0 {{ .MgmtIPv4Gateway }}
 !
!
ssh server v2
end
